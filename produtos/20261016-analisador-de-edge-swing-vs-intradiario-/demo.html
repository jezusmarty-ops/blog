&lt;div style=&quot;position:sticky;top:0;z-index:9;background:#f59e0b;color:#111;padding:8px;text-align:center;font:600 14px sans-serif&quot;&gt;DEMONSTRAÇÃO — versão limitada.&lt;/div&gt;
&lt;div class=&quot;card&quot;&gt;
&lt;h1&gt;Analisador de Edge: Swing vs Intradiário&lt;/h1&gt;
&lt;p class=&quot;sub&quot;&gt;Demonstração: informe taxa de acerto, ganho médio e perda média.&lt;/p&gt;
&lt;label&gt;Taxa de acerto (%)&lt;/label&gt;
&lt;input id=&quot;wr&quot; type=&quot;text&quot; value=&quot;50&quot;&gt;
&lt;label&gt;Ganho médio por operação&lt;/label&gt;
&lt;input id=&quot;g&quot; type=&quot;text&quot; value=&quot;200&quot;&gt;
&lt;label&gt;Perda média por operação&lt;/label&gt;
&lt;input id=&quot;l&quot; type=&quot;text&quot; value=&quot;100&quot;&gt;
&lt;button id=&quot;btn&quot;&gt;Calcular expectativa&lt;/button&gt;
&lt;div class=&quot;out&quot; id=&quot;out&quot;&gt;Aguardando cálculo.&lt;/div&gt;
&lt;/div&gt;
&lt;script&gt;
function num(v){
  v = String(v).trim().replace(&quot;,&quot;, &quot;.&quot;);
  var n = parseFloat(v);
  return isNaN(n) ? 0 : n;
}
document.getElementById(&quot;btn&quot;).addEventListener(&quot;click&quot;, function(){
  var wr = num(document.getElementById(&quot;wr&quot;).value);
  var g = num(document.getElementById(&quot;g&quot;).value);
  var l = Math.abs(num(document.getElementById(&quot;l&quot;).value));
  var p = wr / 100;
  var exp = p * g - (1 - p) * l;
  var txt = &quot;Expectativa por operação: &lt;b&gt;&quot; + exp.toFixed(2) + &quot;&lt;/b&gt;&lt;br&gt;&quot;;
  txt += &quot;Ganho esperado: &quot; + (p * g).toFixed(2) + &quot;&lt;br&gt;&quot;;
  txt += &quot;Perda esperada: &quot; + ((1 - p) * l).toFixed(2) + &quot;&lt;br&gt;&quot;;
  txt += exp &gt; 0 ? &quot;Edge positivo.&quot; : (exp &lt; 0 ? &quot;Edge negativo.&quot; : &quot;Edge neutro.&quot;);
  document.getElementById(&quot;out&quot;).innerHTML = txt;
});
&lt;/script&gt;

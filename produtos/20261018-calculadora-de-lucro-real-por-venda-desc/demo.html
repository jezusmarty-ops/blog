&lt;div class=&quot;card&quot;&gt;
&lt;h1&gt;Calculadora de Lucro Real por Venda&lt;/h1&gt;

function fmt(v){return &#x27;R$ &#x27;+v.toFixed(2).replace(&#x27;.&#x27;,&#x27;,&#x27;);}
btn.addEventListener(&#x27;click&#x27;,function(){
  var p=parseFloat(preco.value),c=parseFloat(custos.value),t=parseFloat(taxas.value);

  var lucro=p-valTaxa-c;
  var margem=p&gt;0?(lucro/p)*100:0;

  res.className=&#x27;res&#x27;+(lucro&lt;0?&#x27; neg&#x27;:&#x27;&#x27;);
